[project]
name = "eye-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateus124", email = "alvesmateusq00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
eye-tracker = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "calibration",
    "cam",
    "display",
    "eyes",
    "face",
    "gaze",
    "heatmap",
    "main",
]
